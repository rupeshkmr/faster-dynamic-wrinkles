<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <!-- 1. The Primary Redirect (Meta Refresh) -->
    <!-- The "0" means wait 0 seconds. Replace the URL with your actual destination. -->
    <meta http-equiv="refresh" content="0; url=https://rupeshkmr.github.io/wrinkle-dynamics/">

    <!-- 2. The Fallback Redirect (JavaScript) -->
    <script>
        window.location.href = "https://rupeshkmr.github.io/wrinkle-dynamics/";
    </script>
</head>

<body>
    <!-- 3. The Manual Fallback (For users with scripts disabled) -->
    <p>If you are not redirected automatically, <a href="https://rupeshkmr.github.io/wrinkle-dynamics/">click here</a>.
    </p>
</body>

</html>
